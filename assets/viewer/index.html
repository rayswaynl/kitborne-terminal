<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090a0c">
<title>Kitborne Terminal</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/terminal-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/tuner.css">
<link rel="stylesheet" href="/category.css">
<script type="importmap">{"imports": {"three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/"}}</script>
</head>
<body class="home">
<header id="bar"></header>
<nav id="steps" aria-label="Stages"></nav>
<main id="main">
  <section id="canvas">
    <div id="filelabel" role="status"></div>
    <div id="view"></div>
    <div id="cmpbar" hidden></div>
    <div id="hover" hidden></div>
    <div id="pop" hidden role="dialog" aria-label="Note"></div>
    <div id="viewmenu" hidden></div>
    <div id="dock" role="toolbar" aria-label="Tools"></div>
  </section>
  <div id="timeline"></div>
  <div id="modelcompare"></div>
</main>
<aside id="side"><div id="sidescroll"></div><footer id="decide"></footer></aside>
<section id="home"></section>
<dialog id="help"></dialog>
<div id="toast" role="status" hidden></div>
<script>
// Boot guard: if app.js fails to start (for example a half-written file during an update), retry instead of leaving an empty page.
(() => {
  const key = 'ar-boot-retry', tries = +sessionStorage.getItem(key) || 0, start = Date.now();
  const booted = () => document.getElementById('bar').childElementCount > 0;
  let failed = false; addEventListener('error', e => { if (e instanceof ErrorEvent) failed = true; });
  const tick = setInterval(() => {
    if (booted()) { sessionStorage.removeItem(key); return clearInterval(tick); }
    const waited = Date.now() - start; if (waited < 3000 || (!failed && waited < 12000)) return;
    clearInterval(tick);
    if (tries < 3) { sessionStorage.setItem(key, tries + 1); return setTimeout(() => location.reload(), 1500); }
    sessionStorage.removeItem(key);
    document.body.insertAdjacentHTML('beforeend', '<div style="position:fixed;inset:0;display:grid;place-content:center;gap:14px;text-align:center;background:#17181b;color:#e8eaed;font:16px system-ui"><b>The viewer could not start.</b><span>It was probably just updated.</span><button onclick="location.reload()" style="font-size:16px;padding:10px 18px;justify-self:center">Reload</button></div>');
  }, 1000);
})();
</script>
<script type="module" src="/app.js"></script>
<script type="module" src="/theme.js"></script>
</body>
</html>
